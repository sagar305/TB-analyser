name: Validate offline analyser
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy frontend to already-enabled GitHub Pages
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calculations, imports, exports and offline assets
        run: node --test tests/*.test.mjs
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - name: Deploy static app
        id: deployment
        uses: actions/deploy-pages@v4
